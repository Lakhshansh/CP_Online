{% extends 'base.html' %}

{% block content %}

<div class="login-card">

    <!-- LOGO -->
    <div class="logo-box">
        <img src="{{ url_for('static', filename='images/logo.png') }}"
             alt="Multi Therapy Management System Logo"
             class="login-logo">
    </div>

    <!-- TITLE -->
    <h2>Multi Therapy Management System</h2>

    <p class="text-muted">
        Online Administration Portal
    </p>

    <!-- LOGIN FORM -->
    <form method="post">

        <!-- USERNAME -->
        <input
            class="form-control mb-3"
            type="text"
            name="username"
            placeholder="Username"
            value="{{ username }}"
            required
        >

        <!-- PASSWORD -->
        <div class="password-wrapper">
            <input
                id="loginPassword"
                class="form-control mb-3"
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button
                type="button"
                id="togglePassword"
                class="password-toggle"
                aria-label="Show password"
                title="Show password"
            >👁️</button>
        </div>

        <style>
            .password-wrapper {
                position: relative;
                width: 100%;
            }

            .password-wrapper .form-control {
                padding-right: 52px;
            }

            .password-toggle {
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                border: none;
                background: transparent;
                font-size: 20px;
                cursor: pointer;
                padding: 6px;
                z-index: 5;
            }

            .password-toggle:hover {
                transform: translateY(-50%) scale(1.08);
            }
        </style>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const password = document.getElementById("loginPassword");
                const toggle = document.getElementById("togglePassword");

                toggle.addEventListener("click", function () {
                    const isHidden = password.type === "password";

                    password.type = isHidden ? "text" : "password";

                    toggle.textContent = isHidden ? "🙈" : "👁️";
                    toggle.setAttribute(
                        "aria-label",
                        isHidden ? "Hide password" : "Show password"
                    );
                    toggle.setAttribute(
                        "title",
                        isHidden ? "Hide password" : "Show password"
                    );
                });
            });
        </script>


        <!-- CAPTCHA -->
        <div class="captcha-section">
            <label for="captchaInput" class="captcha-label">🔐 Security Check</label>

            <div class="captcha-box">
                <img id="captchaImage"
                     src="{{ url_for('captcha_image') }}"
                     alt="CAPTCHA"
                     class="captcha-image">

                <button type="button"
                        class="captcha-refresh"
                        onclick="refreshCaptcha()"
                        title="Refresh CAPTCHA">↻</button>
            </div>

            <input id="captchaInput"
                   class="form-control mt-2"
                   type="text"
                   name="captcha"
                   placeholder="Enter CAPTCHA code"
                   autocomplete="off"
                   maxlength="5"
                   required>
        </div>

        <style>
            .captcha-section { margin: 4px 0 18px; }
            .captcha-label { display:block; font-weight:600; margin-bottom:8px; }
            .captcha-box { display:flex; align-items:center; gap:10px; }
            .captcha-image {
                width:190px; height:65px; border:1px solid #d7dce5;
                border-radius:10px; object-fit:cover; background:#fff;
            }
            .captcha-refresh {
                width:44px; height:44px; border:none; border-radius:10px;
                background:#eef4ff; color:#1769e0; font-size:25px;
                font-weight:700; cursor:pointer; transition:.2s ease;
            }
            .captcha-refresh:hover { transform:rotate(20deg) scale(1.05); }
        </style>

        <script>
            function refreshCaptcha() {
                const image = document.getElementById("captchaImage");
                const input = document.getElementById("captchaInput");
                image.src = "{{ url_for('captcha_image') }}?t=" + Date.now();
                input.value = "";
                input.focus();
            }
        </script>

        <!-- REMEMBER ME + FORGOT PASSWORD -->
        <div class="login-options">

            <label class="remember-me">

                <!-- DEFAULT TICK -->
                <input
                    type="checkbox"
                    name="remember"
                    checked
                >

                <span>Remember Me</span>

            </label>

            <a
                href="{{ url_for('forgot_password') }}"
                class="forgot-password"
            >
                Forgot Password?
            </a>

        </div>

        <!-- LOGIN BUTTON -->
        <button
            type="submit"
            class="btn btn-primary w-100"
        >
            Login
        </button>

    </form>

    <!-- SIGN UP BUTTON -->
    <a
        href="{{ url_for('signup') }}"
        class="btn btn-outline-success w-100 mt-2"
    >
        Sign Up
    </a>

</div>

{% endblock %}
