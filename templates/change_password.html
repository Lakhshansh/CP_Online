{% extends "base.html" %}

{% block content %}

<style>
    .change-pwd-wrapper {
        max-width: 600px;
        margin: 30px auto;
        padding: 10px 20px 40px;
    }

    .change-pwd-card {
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        overflow: hidden;
        border: 1px solid #e8edf5;
    }

    .change-pwd-header {
        padding: 26px 30px;
        background: linear-gradient(135deg, #eef5ff, #f8fbff);
        border-bottom: 1px solid #e4ebf5;
    }

    .change-pwd-header h2 {
        margin: 0;
        color: #173b70;
        font-size: 24px;
        font-weight: 700;
    }

    .change-pwd-header p {
        margin: 6px 0 0;
        color: #6b7280;
        font-size: 14px;
    }

    .change-pwd-body {
        padding: 30px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 20px;
    }

    .form-group label {
        font-size: 14px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 8px;
    }

    .pwd-input-group {
        position: relative;
        display: flex;
        align-items: center;
    }

    .pwd-input-group input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 46px 12px 14px;
        border: 1px solid #d7deea;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        transition: 0.2s;
        background: #fff;
    }

    .pwd-input-group input:focus {
        border-color: #3778d4;
        box-shadow: 0 0 0 3px rgba(55, 120, 212, 0.12);
    }

    .pwd-toggle-btn {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 16px;
        color: #6b7280;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .pwd-actions {
        display: flex;
        gap: 12px;
        margin-top: 25px;
    }

    .btn-save {
        flex: 1;
        background: linear-gradient(135deg, #1d68d8, #1557bf);
        color: #ffffff;
        border: none;
        padding: 13px 20px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    .btn-save:hover {
        opacity: 0.95;
        transform: translateY(-1px);
    }

    .btn-cancel {
        padding: 13px 20px;
        background: #f3f4f6;
        color: #4b5563;
        border-radius: 10px;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
    }

    .btn-cancel:hover {
        background: #e5e7eb;
        color: #1f2937;
    }
</style>

<div class="change-pwd-wrapper">
    <div class="change-pwd-card">
        <div class="change-pwd-header">
            <h2>🔑 Change Password</h2>
            <p>Update your account password securely</p>
        </div>

        <div class="change-pwd-body">
            <form method="post" action="{{ url_for('change_password') }}">
                <div class="form-group">
                    <label for="current_password">Current Password</label>
                    <div class="pwd-input-group">
                        <input
                            type="password"
                            id="current_password"
                            name="current_password"
                            placeholder="Enter current password"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="pwd-toggle-btn" onclick="togglePassword('current_password', this)">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <div class="pwd-input-group">
                        <input
                            type="password"
                            id="new_password"
                            name="new_password"
                            placeholder="At least 6 characters"
                            required
                            minlength="6"
                            autocomplete="new-password"
                        >
                        <button type="button" class="pwd-toggle-btn" onclick="togglePassword('new_password', this)">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <div class="pwd-input-group">
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Re-enter new password"
                            required
                            minlength="6"
                            autocomplete="new-password"
                        >
                        <button type="button" class="pwd-toggle-btn" onclick="togglePassword('confirm_password', this)">👁️</button>
                    </div>
                </div>

                <div class="pwd-actions">
                    <button type="submit" class="btn-save">Update Password</button>
                    <a href="{{ url_for('profile') }}" class="btn-cancel">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = '🙈';
        } else {
            input.type = 'password';
            btn.textContent = '👁️';
        }
    }
</script>

{% endblock %}
