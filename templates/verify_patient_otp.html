{% extends 'base.html' %}

{% block content %}
<div class="login-card">
    <div class="logo-box">
        <img src="{{ url_for('static', filename='images/logo.png') }}"
             alt="Multi Therapy Management System Logo"
             class="login-logo">
    </div>

    <h2>Verify Patient Email</h2>
    <p class="text-muted">
        Enter the 6-digit OTP sent to <strong>{{ email }}</strong>.
    </p>

    <form method="POST" action="{{ url_for('verify_patient_otp') }}">
        <input
            class="form-control mb-3"
            type="text"
            name="email_otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            pattern="[0-9]{6}"
            inputmode="numeric"
            autocomplete="one-time-code"
            required
        >

        <button type="submit" class="btn btn-success w-100">
            Verify Patient OTP
        </button>
    </form>

    <a href="{{ url_for('resend_patient_otp') }}"
       class="btn btn-outline-primary w-100 mt-2">
        Resend OTP
    </a>
</div>
{% endblock %}
