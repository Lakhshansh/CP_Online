{% extends 'base.html' %}

{% block content %}

<div class="login-card">

    <!-- LOGO -->
    <div class="logo-box">
        <img src="{{ url_for('static', filename='images/logo.png') }}"
             alt="CP Management System Logo"
             class="login-logo">
    </div>

    <h2>Reset Password</h2>

    <p class="text-muted">
        Enter your new password
    </p>

    <form method="POST"
          action="{{ url_for('reset_password') }}">

        <!-- New Password -->
        <input
            class="form-control mb-3"
            type="password"
            name="password"
            placeholder="New Password"
            minlength="6"
            required
        >

        <!-- Confirm Password -->
        <input
            class="form-control mb-3"
            type="password"
            name="confirm_password"
            placeholder="Confirm New Password"
            minlength="6"
            required
        >

        <button
            type="submit"
            class="btn btn-primary w-100"
        >
            Reset Password
        </button>

    </form>

    <a
        href="{{ url_for('login') }}"
        class="btn btn-outline-primary w-100 mt-2"
    >
        ← Back to Login
    </a>

</div>

{% endblock %}
